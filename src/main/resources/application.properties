server.port=8085

spring.ai.bedrock.aws.region=us-east-1
spring.ai.bedrock.aws.access-key=${AWS_ACCESS_KEY_ID}
spring.ai.bedrock.aws.secret-key=${AWS_SECRET_ACCESS_KEY}
spring.ai.bedrock.converse.chat.options.model=us.anthropic.claude-sonnet-4-20250514-v1:0

# WARNING: enabling this BREAKS the Tool Search Tool demo.
# ToolSearchToolCallAdvisor extends ToolCallAdvisor, which owns the recursive
# tool-execution loop and relies on internal tool execution. Setting this to
# false makes the loop run once and return an incomplete answer (see
# ENGINEERING-CHALLENGES.md #3). Left commented out on purpose — uncomment ONLY
# to demonstrate the failure mode on stage, then re-comment.
#spring.ai.bedrock.converse.chat.options.internal-tool-execution-enabled=false

# NOTE: The following property has NO effect on this project. It belongs to the
# Spring AI 2.0.0 core starter (spring-ai-starter-tool-search-advisor). This demo
# is on the community 1.0.x line and wires the advisor manually in
# ToolSearchConfig, so this property is inert here. Shown for reference only:
#spring.ai.chat.client.tool-search-advisor.enabled=true
