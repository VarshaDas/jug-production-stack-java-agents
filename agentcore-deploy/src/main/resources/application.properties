# Region + explicit AWS credentials so Spring AI 2.0.0 uses access-key/secret-key
# auth (via env vars) instead of the newer Bedrock API-key path, which fails with
# "Authentication failed: Please make sure your API Key is valid" when no key is set.
# spring.ai.bedrock.aws.region=us-east-1
# spring.ai.bedrock.aws.access-key=${AWS_ACCESS_KEY_ID}
# spring.ai.bedrock.aws.secret-key=${AWS_SECRET_ACCESS_KEY}

# Model known to work in this account (same as the TST demo). Nova Lite may not
# be enabled — switch back to amazon.nova-lite-v1:0 if you prefer and it's enabled.

spring.ai.bedrock.converse.chat.model=amazon.nova-lite-v1:0
spring.ai.bedrock.converse.chat.options.temperature=1.0

