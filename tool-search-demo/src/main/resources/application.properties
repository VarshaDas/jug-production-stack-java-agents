server.port=8085

spring.ai.bedrock.aws.region=us-east-1
spring.ai.bedrock.aws.access-key=${AWS_ACCESS_KEY_ID}
spring.ai.bedrock.aws.secret-key=${AWS_SECRET_ACCESS_KEY}
spring.ai.bedrock.converse.chat.options.model=us.anthropic.claude-sonnet-4-20250514-v1:0

# ── Tool Search Tool (CORE Spring AI 2.0, same starter as the blog) ─────────
# Auto-configured from these properties — no manual bean wiring (see
# ToolSearchConfig). Only the search tool is sent initially; the model
# discovers the rest on demand.
spring.ai.chat.client.tool-search-advisor.enabled=true
# lucene = keyword search over tool names/descriptions. No embedding model, no
# ONNX/network dependency, fast startup. (The blog uses 'vector' for semantic
# search, which needs a VectorStore + embedding model; we deliberately use
# lucene to keep the demo lightweight and resilient.)
spring.ai.chat.client.tool-search-advisor.tool-index-type=lucene
spring.ai.chat.client.tool-search-advisor.max-results=5
# Keep tools discovered earlier in a conversation available for multi-step
# tasks so the model does not have to re-search for them.
spring.ai.chat.client.tool-search-advisor.reference-tool-name-accumulation=true
